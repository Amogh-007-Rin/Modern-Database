services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-database
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: enjin
      MONGO_INITDB_ROOT_PASSWORD: google
  
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      # Database connection details
      ME_CONFIG_MONGODB_ADMINUSERNAME: enjin
      ME_CONFIG_MONGODB_ADMINPASSWORD: google
      ME_CONFIG_MONGODB_SERVER: mongodb
      
      # Browser web interface login details (Change these to whatever you want)
      ME_CONFIG_BASICAUTH_USERNAME: enjin
      ME_CONFIG_BASICAUTH_PASSWORD: google
    depends_on:
      - mongodb

volumes:
  mongo_data:
